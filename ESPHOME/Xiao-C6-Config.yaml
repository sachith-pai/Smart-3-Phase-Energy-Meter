esphome:
  name: energy-meter-c6
  friendly_name: Energy Meter-c6
  on_boot:
      priority: 600
      then:
          - output.turn_off: rf_switch_enable
          - output.turn_off: rf_antenna_select
          - script.execute: display_cycle
output:
    - platform: gpio
      id: rf_switch_enable
      pin: RF_SWITCH_EN

    - platform: gpio
      id: rf_antenna_select
      pin: RF_ANT_SELECT

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "CHANGE_THIS_TO_SOMETHING_RANDOM"

ota:
  - platform: esphome
    password: "CHANGE_THIS_TO_SOMETHING_RANDOM"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Energy-Meter-C6 Fallback Hotspot"
    password: "CHANGE_THIS_TO_SOMETHING_RANDOM"

captive_portal:

uart:
  tx_pin: D9
  rx_pin: D8
  baud_rate: 9600

modbus:

sensor:
  - platform: pzemac
    address: 0x01
    current:
      name: "P1 Current"
      id: p1_curr
    voltage:
      name: "P1 Voltage"
      id: p1_volt
      filters: 
        - timeout:
            timeout: 5s
            value: !lambda return 0;       
    energy:
      name: "P1 Energy"
      filters:
        - timeout:
            timeout: 5s
            value: !lambda return 0;             
    power:
      name: "P1 Power"
      id: p1_watts
    frequency:
      name: "P1 Frequency"
      id: p1_freq
    power_factor:
      name: "P1 Power Factor"
    update_interval: 2s

  - platform: pzemac
    address: 0x02
    current:
      name: "P2 Current"
      id: p2_curr
    voltage:
      name: "P2 Voltage"
      id: p2_volt
      filters: 
        - timeout:
            timeout: 5s
            value: !lambda return 0;       
    energy:
      name: "P2 Energy"
      filters:
        - timeout:
            timeout: 5s
            value: !lambda return 0;             
    power:
      name: "P2 Power"
      id: p2_watts
    frequency:
      name: "P2 Frequency"
      id: p2_freq

    power_factor:
      name: "P2 Power Factor"
    update_interval: 2s    

  - platform: pzemac
    address: 0x03
    current:
      name: "P3 Current"
      id: p3_curr
    voltage:
      name: "P3 Voltage"
      id: p3_volt
      filters: 
        - timeout:
            timeout: 5s
            value: !lambda return 0;       
    energy:
      name: "P3 Energy"
      filters:
        - timeout:
            timeout: 5s
            value: !lambda return 0;             
    power:
      name: "P3 Power"
      id: p3_watts
    frequency:
      name: "P3 Frequency"
      id: p3_freq
    power_factor:
      name: "P3 Power Factor"
    update_interval: 2s    

  - platform: template    
    name: "Total Power kW"
    id: total_power_kw
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s

    lambda: |-
      // Get states, defaulting to 0 if the sensor is unavailable (NaN)
      float p1 = id(p1_watts).state;
      float p2 = id(p2_watts).state;
      float p3 = id(p3_watts).state;
      
      float total_w = (isnan(p1) ? 0 : p1) + (isnan(p2) ? 0 : p2) + (isnan(p3) ? 0 : p3);
      
      return total_w / 1000.0; // Convert Watts to kW

  - platform: wifi_signal
    id: wifi1
    update_interval: 60s
    entity_category: "diagnostic"
    internal: true  
     
i2c:
  sda: D1
  scl: D2
  scan: true

color:
  - id: white
    red: 100%
    green: 100%
    blue: 100%

font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
  - file: "gfonts://Roboto"
    id: default_font
    size: 10
  - file: "gfonts://Material+Symbols+Outlined" 
    id: material_symbols_18
    size: 18

image:
  - file: mdi:wifi
    id: wifi_icon
    type: BINARY
    resize: 12x12
  - file: mdi:lightning-bolt-outline
    id: lightning
    type: BINARY
    resize: 17X17

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: dis
    update_interval: 1s
    pages:

      - id: p0 #Boot Screen 
        lambda: |- 
          it.printf(62, 10, id(roboto_12), white, TextAlign::TOP_CENTER, "Smart Energy Meter");
          
          it.image(56, 45, id(lightning)); 
          

      - id: p1   # Total output 
        lambda: |-  
          it.printf(34, 20, id(roboto_12), white, "%.3f kW", id(total_power_kw).state);
          it.printf(100, 48, id(default_font), white, "%.0f", id(p3_watts).state);
          it.printf(58, 48, id(default_font), white, "%.0f", id(p2_watts).state);
          it.printf(10, 48, id(default_font), white, "%.0f", id(p1_watts).state);    
          it.printf(100, 38, id(default_font), white, "P3");
          it.filled_rectangle(84, 39, 1, 30, white);
          it.printf(56, 38, id(default_font), white, "P2");
          it.printf(11, 38, id(default_font), white, "P1");
          it.filled_rectangle(42, 40, 1, 30, white);
          it.filled_rectangle(0, 39, 128, 1, white);
          it.printf(25, 25, id(default_font), white, "");
          // it.printf(86, 15, id(material_symbols_18), white, "KW");
          it.filled_rectangle(0, 13, 128, 1, white);
          it.printf(94, 0, id(roboto_12), Color::WHITE, "%.0f dBm", id(wifi1).state);
          it.image(7, 0, id(wifi_icon)); 
          it.printf(25, 0, id(roboto_12), Color::WHITE, "WiFi");

      - id: p2  # Phase 1
        lambda: |-
          it.printf(34, 20, id(roboto_12), white, "%.3f W", id(p1_watts).state);
          it.printf(100, 48, id(default_font), white, "%.0f", id(p1_freq).state); //First box
          it.printf(58, 48, id(default_font), white, "%.0f", id(p1_volt).state);  // SEC BOX
          it.printf(10, 48, id(default_font), white, "%.0f", id(p1_curr).state);  //Third Box  
          it.printf(100, 38, id(default_font), white, "Freq"); //First Box
          it.filled_rectangle(84, 39, 1, 30, white);
          it.printf(49, 38, id(default_font), white, "Voltage"); //Sec Box
          it.printf(5, 38, id(default_font), white, "Current"); // Third
          it.printf(43, 0, id(roboto_12), white, "Phase 1 ");
          it.filled_rectangle(42, 40, 1, 60, white);
          it.filled_rectangle(0, 39, 128, 1, white);
          it.printf(25, 25, id(default_font), white, "");
          // it.printf(86, 15, id(material_symbols_18), white, "KW");
          it.filled_rectangle(0, 13, 128, 1, white);
          it.printf(94, 0, id(roboto_12), Color::WHITE, "%.0f dBm", id(wifi1).state);
          it.image(7, 0, id(wifi_icon)); 

      - id: p3  #Phase 2
        lambda: |-
          it.printf(34, 20, id(roboto_12), white, "%.3f W", id(p2_watts).state);
          it.printf(100, 48, id(default_font), white, "%.0f", id(p2_freq).state); //First box
          it.printf(58, 48, id(default_font), white, "%.0f", id(p2_volt).state);  // SEC BOX
          it.printf(10, 48, id(default_font), white, "%.0f", id(p2_curr).state);  //Third Box  
          it.printf(100, 38, id(default_font), white, "Freq"); //First Box
          it.filled_rectangle(84, 39, 1, 30, white);
          it.printf(49, 38, id(default_font), white, "Voltage"); //Sec Box
          it.printf(5, 38, id(default_font), white, "Current"); // Third
          it.printf(43, 0, id(roboto_12), white, "Phase 2 ");
          it.filled_rectangle(42, 40, 1, 60, white);
          it.filled_rectangle(0, 39, 128, 1, white);
          it.printf(25, 25, id(default_font), white, "");
          // it.printf(86, 15, id(material_symbols_18), white, "KW");
          it.filled_rectangle(0, 13, 128, 1, white);
          it.printf(94, 0, id(roboto_12), Color::WHITE, "%.0f dBm", id(wifi1).state);
          it.image(7, 0, id(wifi_icon)); 

      - id: p4  #Phase 3
        lambda: |-
          it.printf(34, 20, id(roboto_12), white, "%.3f W", id(p3_watts).state);
          it.printf(100, 48, id(default_font), white, "%.0f", id(p3_freq).state); //First box
          it.printf(58, 48, id(default_font), white, "%.0f", id(p3_volt).state);  // SEC BOX
          it.printf(10, 48, id(default_font), white, "%.0f", id(p3_curr).state);  //Third Box  
          it.printf(100, 38, id(default_font), white, "Freq"); //First Box
          it.filled_rectangle(84, 39, 1, 30, white);
          it.printf(49, 38, id(default_font), white, "Voltage"); //Sec Box
          it.printf(5, 38, id(default_font), white, "Current"); // Third
          it.printf(43, 0, id(roboto_12), white, "Phase 3 ");
          it.filled_rectangle(42, 40, 1, 60, white);
          it.filled_rectangle(0, 39, 128, 1, white);
          it.printf(25, 25, id(default_font), white, "");
          // it.printf(86, 15, id(material_symbols_18), white, "KW");
          it.filled_rectangle(0, 13, 128, 1, white);
          it.printf(94, 0, id(roboto_12), Color::WHITE, "%.0f dBm", id(wifi1).state);
          it.image(7, 0, id(wifi_icon)); 






script:
  - id: display_cycle
    mode: restart
    then:
      - delay: 1s          
      - display.page.show: p0
      - component.update: dis
      - delay: 2s
      - while:
          condition:
            lambda: 'return true;'
          then:

            - display.page.show: p1  #Main
            - component.update: dis
            - delay: 30s

            - display.page.show: p2  #Phase 1
            - component.update: dis
            - delay: 5s
            
            - display.page.show: p3 #Phase 2
            - component.update: dis
            - delay: 5s
            
#            - display.page.show: p4
#            - component.update: dis
#            - delay: 2s
